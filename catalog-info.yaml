apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ph-ee-operations-app
  title: PaymentHub Operations App
  description: >
    Operations service for PaymentHub. Exposes transaction status,
    workflow instance query, and reconciliation APIs consumed by
    Camel routes and the Zeebe worker layer.
  annotations:
    github.com/project-slug: one-acre-fund/oaf--ph-ee-operations-app
    backstage.io/kubernetes-id: ph-ee-operations-app
    backstage.io/kubernetes-namespace: paymenthub
    backstage.io/techdocs-ref: dir:.
    sonarqube.org/project-key: one-acre-fund_ph-ee-operations-app
    backstage.io/code-coverage: sonarqube
  tags:
    - java
    - spring-boot
    - apache-camel
    - payment-hub
    - paymenthub
    - operations
  links:
    - url: https://github.com/one-acre-fund/oaf--ph-ee-operations-app/blob/main/README.md
      title: README
      icon: docs
    - url: https://sonarcloud.io/project/overview?id=one-acre-fund_oaf--ph-ee-operations-app
      title: Code Quality Dashboard
      icon: dashboard
    - url: https://ph-web.oneacrefund.org
      title: Production Environment
      icon: globe
    - url: https://elastic.oneacrefund.org/app/apm/services/ph-ee-connector-operations-app
      title: Elastic APM Dashboard
      icon: globe
    - url: https://elastic.oneacrefund.org/app/r/s/CgjiD
      title: Kong Ingress logs
      icon: globe
    - url: https://github.com/one-acre-fund/oaf--ph-ee-operations-app/blob/develop/.github/workflows/build.yaml
      title: Build Pipeline
      icon: build
spec:
  type: service
  lifecycle: production
  owner: group:one-acre-fund/credits-and-payments
  system: operations
  providesApis:
    - operations-transaction-api
  consumesApis:
    - zeebe-gateway-grpc-api
  dependsOn:
    - resource:default/paymenthub-mysql
