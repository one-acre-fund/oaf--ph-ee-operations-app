/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '2.1.9.RELEASE'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}
apply plugin: "io.spring.dependency-management"

repositories {
    maven {
        url = uri('https://repo.maven.apache.org/maven2')
    }

    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

dependencies {
    implementation 'org.springframework.security:spring-security-jwt:1.1.0.RELEASE'
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.json:json:20190722'
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa:2.7.6'
    implementation 'org.hibernate:hibernate-jpamodelgen:5.4.17.Final'
    implementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:5.4.17.Final'
    implementation 'joda-time:joda-time:2.10.6'
    implementation 'org.apache.commons:commons-lang3:3.3.2'
    implementation 'com.zaxxer:HikariCP:3.4.5'
    implementation 'mysql:mysql-connector-java:8.0.20'
    implementation 'com.googlecode.flyway:flyway-core:2.1.1'
    implementation 'net.sf.ehcache:ehcache:2.10.6'
    testImplementation 'junit:junit:4.11'
    implementation 'net.sf.supercsv:super-csv:2.4.0'
    implementation 'com.amazonaws:aws-java-sdk:1.11.486'
    implementation 'com.azure:azure-storage-blob:12.12.0'
    implementation 'commons-io:commons-io:2.4'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    implementation "org.springdoc:springdoc-openapi-ui:1.6.11"
    implementation 'org.mifos:ph-ee-connector-common:1.4.1-gazelle'

    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'org.springframework:spring-test:5.1.10.RELEASE'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation("org.keycloak:keycloak-spring-boot-starter:25.0.3")
}

group = 'org.apache.fineract'
version = 'v1.1.9'
sourceCompatibility = '11'


publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}


tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test // Ensures tests are run before generating the report
    reports {
        xml.required = true // Enable XML report generation
        html.required = true // Enable HTML report generation
        xml.destination file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
        html.destination file("${buildDir}/reports/jacoco/test/html")
    }
}


sonarqube {
    properties {
        property "sonar.projectKey", "one-acre-fund_oaf--ph-ee-operations-app"
        property "sonar.organization", "one-acre-fund"
        property "sonar.token", System.getenv("SONAR_TOKEN")
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectBaseDir", "${project.projectDir}"
        property "sonar.java.binaries", layout.buildDirectory.dir("classes/java/main").get().asFile.absolutePath
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml").get().asFile.absolutePath
        property "sonar.newCode.period", "previous_version"
        property "sonar.newCode.referenceBranch", "main"
    }
}