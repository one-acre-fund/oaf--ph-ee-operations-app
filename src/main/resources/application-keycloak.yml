fineract:
  datasource:
    core:
      host: operations-mysql
      port: 3306
      schema: tenants
      username: root
      password: mysql
    common:
      protocol: jdbc
      subprotocol: mysql
      driverclass_name: com.mysql.cj.jdbc.Driver

# Interface time zone reference : https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
interface:
  timezone: "Asia/Kolkata"

token:
  user:
    access-validity-seconds: 600
    refresh-validity-seconds: 43200
  client:
    access-validity-seconds: 3600
    channel:
      secret: ""

config:
  imu:
    rate-validity-seconds: 300

caching:
  enabled: false

security:
  filter-order: 4
  jws:
    enable: false

keycloak:
  realm: ${KEYCLOAK_REALM:OneAcreFund}
  auth-server-url: ${KEYCLOAK_BASE_URL:https://accounts.qa.oneacrefund.org}
  resource: ${KEYCLOAK_CLIENT_ID:paymenthub}
  bearer-only: true
  ssl-required: none

spring:
  resources:
    add-mappings: false
  mvc:
    favicon:
      enabled: false
  jmx:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
    whitelist:

server:
  port: 5000

rest:
  authorization:
    enabled: false
    settings:
      - endpoint: "/api/v1/transfer/*/refund"
        authority: "hasAuthority('REFUND')"
      - endpoint: "/api/v1/**"
        authority: "hasAuthority('ALL_FUNCTIONS')"
logging:
  level:
    ROOT: ERROR
    pattern:
      console: "%clr(%d{dd-MM-yyyy HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%35.35t]){faint} %clr(%-28.28logger{28}){cyan} %clr(:){faint}%X{BUSINESS-LOG} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

cloud:
  aws:
    enabled: true
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: us-east-2
    stack:
      auto: false
  azure:
    enabled: false
    blob:
      connection-string:

payment:
  modes:
    - id: "slcb"
      type: "BATCH"

application:
  bucket-name: paymenthub-ee-dev

ams:
  sources: '[{"name": "TUPANDE ACCOUNT", "id": "TUPANDEACCOUNTID"}]'

springdoc:
  swagger-ui:
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:paymenthub}
      realm: ${KEYCLOAK_REALM:OneAcreFund}
      app-name: Payment Hub
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: ${FINERACT_SWAGGER_REDIRECT_URL:http://localhost:5050/swagger-ui/oauth2-redirect.html}

